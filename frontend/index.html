<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Song Chatbot 🎵</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

/* LOGIN */
#authBox {
    text-align: center;
    margin-top: 100px;
}

#authBox input {
    padding: 12px;
    margin: 6px;
    width: 240px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #111827;
    color: white;
}

#authBox button {
    margin: 5px;
    padding: 10px 14px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

/* CHAT CONTAINER */
.chat-container {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    display: none;
    flex-direction: column;
    background: #0f172a;
}

/* HEADER */
.header {
    padding: 16px;
    background: #111827;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
}

/* CHAT BOX */
.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

/* MESSAGE */
.msg {
    margin: 8px;
    padding: 12px 14px;
    border-radius: 12px;
    max-width: 75%;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #1f2937;
    align-self: flex-start;
}

/* INPUT AREA */
.input-area {
    display: flex;
    padding: 12px;
    background: #111827;
    border-top: 1px solid #1f2937;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #0b1220;
    color: white;
}

button {
    margin-left: 8px;
    padding: 12px 16px;
    background: #22c55e;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: #16a34a;
}

/* MOBILE */
@media (max-width: 600px) {
    .msg {
        max-width: 90%;
        font-size: 13px;
    }

    #authBox input {
        width: 90%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
    <h2>Login / Signup</h2>

    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>

    <button onclick="signup()">Signup</button>
    <button onclick="login()">Login</button>
    <button onclick="googleLogin()">Google Login</button>
</div>

<!-- CHAT -->
<div class="chat-container">

    <div class="header">🎵 AI Song Chatbot</div>

    <div id="chat" class="chat-box"></div>

    <div class="input-area">
        <input id="input" placeholder="Type your mood..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");

/* UI MESSAGE */
function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* SEND MESSAGE */
async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {
        const user = auth.currentUser;

        const res = await fetch("https://song-chatbot-backend.onrender.com/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                user: user ? user.email : "guest"
            })
        });

        const data = await res.json();

        addMessage(data.reply, "bot");

        if (data.songs) {
            addMessage("🎧 " + data.songs.join(", "), "bot");
        }

        saveChat(user, text, data.reply, data.mood);

    } catch (err) {
        addMessage("❌ Server not reachable", "bot");
    }
}

/* ENTER KEY */
document.addEventListener("keydown", e => {
    if (e.key === "Enter" && document.activeElement.id === "input") {
        sendMessage();
    }
});
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbtvDAa4D7CENw8fe7T3jvZNy9nDsplPw",
  authDomain: "song-chatbot.firebaseapp.com",
  projectId: "song-chatbot",
  storageBucket: "song-chatbot.appspot.com",
  messagingSenderId: "573261352496",
  appId: "1:573261352496:web:33b9edba7b2b86dc3427f5"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* SAVE CHAT */
function saveChat(user, message, reply, mood) {
    if (!user) return;

    db.ref("chats/" + user.uid).push({
        message,
        reply,
        mood,
        time: Date.now()
    });
}

/* AUTH */
window.signup = () => {
    auth.createUserWithEmailAndPassword(email.value, password.value)
        .then(() => alert("Signup success"))
        .catch(e => alert(e.message));
};

window.login = () => {
    auth.signInWithEmailAndPassword(email.value, password.value)
        .then(() => alert("Login success"))
        .catch(e => alert(e.message));
};

window.googleLogin = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then(() => alert("Google login success"))
        .catch(e => alert(e.message));
};

/* AUTH STATE */
auth.onAuthStateChanged(user => {
    if (user) {
        authBox.style.display = "none";
        document.querySelector(".chat-container").style.display = "flex";
    } else {
        authBox.style.display = "block";
        document.querySelector(".chat-container").style.display = "none";
    }
});
</script>

</body>
</html>
