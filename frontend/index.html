<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Song Chatbot 🎵</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

/* LOGIN */
#authBox {
    text-align: center;
    margin-top: 80px;
}

/* CHAT */
.chat-container {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    display: none;
    flex-direction: column;
}

.header {
    padding: 15px;
    background: #111827;
    text-align: center;
    font-weight: bold;
}

.chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.msg {
    margin: 8px;
    padding: 10px;
    border-radius: 8px;
    max-width: 80%;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #1f2937;
}

.input-area {
    display: flex;
    padding: 10px;
    background: #111827;
}

input {
    flex: 1;
    padding: 10px;
}

button {
    margin-left: 5px;
    padding: 10px;
    background: #22c55e;
    border: none;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
    <h2>Login / Signup</h2>

    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>

    <button onclick="signup()">Signup</button>
    <button onclick="login()">Login</button>
    <button onclick="googleLogin()">Google Login</button>
</div>

<!-- CHAT -->
<div class="chat-container">

    <div class="header">🎵 Song Chatbot</div>

    <div id="chat" class="chat-box"></div>

    <div class="input-area">
        <input id="input" placeholder="Type your mood..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<!-- CHAT SCRIPT -->
<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const user = auth.currentUser;

    const res = await fetch("https://song-chatbot-backend.onrender.com/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            user: user ? user.email : "guest"
        })
    });

    const data = await res.json();

    addMessage(data.reply, "bot");

    if (data.songs) {
        addMessage("🎧 " + data.songs.join(", "), "bot");
    }
}

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbtvDAa4D7CENw8fe7T3jvZNy9nDsplPw",
  authDomain: "song-chatbot.firebaseapp.com",
  projectId: "song-chatbot",
  storageBucket: "song-chatbot.appspot.com",
  messagingSenderId: "573261352496",
  appId: "1:573261352496:web:33b9edba7b2b86dc3427f5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* SIGNUP */
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value)
    .then(()=> alert("Signup success"))
    .catch(e => alert(e.message));
}

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
    .then(()=> alert("Login success"))
    .catch(e => alert(e.message));
}

/* GOOGLE LOGIN */
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(()=> alert("Google login success"))
    .catch(e => alert(e.message));
}

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("authBox").style.display = "none";
    document.querySelector(".chat-container").style.display = "flex";
  } else {
    document.getElementById("authBox").style.display = "block";
    document.querySelector(".chat-container").style.display = "none";
  }
});
</script>

</body>
</html>
