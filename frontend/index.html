<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Song Chatbot 🎵</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

/* LOGIN */
#authBox {
    text-align: center;
    margin-top: 100px;
}

#authBox input {
    padding: 10px;
    margin: 6px;
    width: 220px;
    border-radius: 6px;
    border: none;
}

/* CHAT */
.chat-container {
    width: 100%;
    max-width: 850px;
    height: 100vh;
    display: none;
    flex-direction: column;
}

.header {
    padding: 15px;
    background: #111827;
    text-align: center;
    font-weight: bold;
}

.chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.msg {
    margin: 8px;
    padding: 10px;
    border-radius: 10px;
    max-width: 80%;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #1f2937;
    align-self: flex-start;
}

.input-area {
    display: flex;
    padding: 10px;
    background: #111827;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    outline: none;
}

button {
    margin-left: 6px;
    padding: 10px;
    background: #22c55e;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="authBox">
    <h2>Login</h2>
    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>

    <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div class="chat-container">

    <div class="header">🎵 AI Song Chatbot</div>

    <div id="chat" class="chat-box"></div>

    <div class="input-area">
        <input id="input" placeholder="Type your mood..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {
        const res = await fetch("https://song-chatbot-backend.onrender.com/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, user: "guest" })
        });

        const data = await res.json();

        addMessage(data.reply, "bot");

        if (data.formattedSongs) {
            addMessage(data.formattedSongs, "bot");
        }

    } catch (err) {
        addMessage("❌ Server not reachable", "bot");
    }
}

document.addEventListener("keydown", e => {
    if (e.key === "Enter" && document.activeElement.id === "input") {
        sendMessage();
    }
});

/* SIMPLE LOGIN (UI ONLY) */
function login() {
    document.getElementById("authBox").style.display = "none";
    document.querySelector(".chat-container").style.display = "flex";
}
</script>

</body>
</html>
