<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Song Recommendation Chatbot 🎵</title>

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

/* ===== MAIN CONTAINER ===== */
.chat-container {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ===== HEADER ===== */
.header {
    padding: 15px;
    background: #111827;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
}

/* ===== CHAT BOX ===== */
.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* messages */
.msg {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 80%;
    line-height: 1.4;
}

.user {
    background: #2563eb;
    align-self: flex-end;
    margin-left: auto;
}

.bot {
    background: #1f2937;
}

/* ===== INPUT AREA ===== */
.input-area {
    display: flex;
    padding: 10px;
    background: #111827;
    border-top: 1px solid #1f2937;
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

button {
    margin-left: 10px;
    padding: 12px 16px;
    background: #22c55e;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 600px) {
    .msg {
        max-width: 95%;
    }

    button {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        🎵 Song Recommendation Chatbot
    </div>

    <div id="chat" class="chat-box"></div>

    <div class="input-area">
        <input id="input" type="text" placeholder="Type how you feel..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");

/* ===== SEND MESSAGE ===== */
async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const res = await fetch("https://song-chatbot-backend.onrender.com/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    addMessage(data.reply, "bot");
    if (data.songs) {
        addMessage("🎧 " + data.songs.join(", "), "bot");
    }
}

/* ===== ADD MESSAGE ===== */
function addMessage(text, type) {
    const div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== ENTER KEY SUPPORT ===== */
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
